<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>rnft.life</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
		    'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
		    sans-serif;
		  -webkit-font-smoothing: antialiased;
		  -moz-osx-font-smoothing: grayscale;
		  text-align: center;

		  margin: 0;
		  background-color: lightgrey;
		}
		:root {
		  --color1: rgb(0, 231, 255);
		  --color2: rgb(255, 0, 231);
		  --back: url(https://cdn2.bulbagarden.net/upload/1/17/Cardback.jpg);
		  --charizard1: #fac;
		  --charizard2: #ddccaa;
		  --pika1: #54a29e;
		  --pika2: #a79d66;
		  --eevee1: #efb2fb;
		  --eevee2: #acc6f8;
		  --mewtwo1: #efb2fb;
		  --mewtwo2: #acc6f8;
		}

		.card {
		    background-size: contain;
		    width: 50%;
		  
		  position: relative;
		  overflow: hidden;
		  margin: auto;
		  overflow: hidden;
		  z-index: 10;
		  touch-action: none;
		  border-radius: 5%/3.5%;
		  box-shadow: -5px -5px 5px -5px var(--color1), 5px 5px 5px -5px var(--color2), -7px -7px 10px -5px transparent, 7px 7px 10px -5px transparent, 0 0 5px 0px rgba(255, 255, 255, 0), 0 55px 35px -20px rgba(0, 0, 0, 0.5);
		  transition: transform 0.5s ease, box-shadow 0.2s ease;
		  will-change: transform, filter;
		  background-color: #040712;
		  background-image: url(https://www.trustedtarot.com/img/cards/the-magician.png);
		  background-size: cover;
		  background-repeat: no-repeat;
		  background-position: 10% 20%;
		  transform-origin: center;
		}

		p {
		  margin: 0px;
		  font-family: 'circular';
		}
		.tag-titles {
			position: 'relative'
		}

		#titles {
			color: #422804;
			position: absolute;
			bottom: 200px;
			left: 50%;
			transform: translateX(-50%);
		}

		.card:before,
		.card:after {
		  content: "";
		  position: absolute;
		  left: 0;
		  right: 0;
		  bottom: 0;
		  top: 0;
		  background-repeat: no-repeat;
		  opacity: 0.5;
		  mix-blend-mode: color-dodge;
		  transition: all 0.33s ease;
		}

		.card:before {
		  background-position: 50% 50%;
		  background-size: 250% 250%;
		  background-image: linear-gradient(115deg, transparent 0%, var(--color1) 25%, transparent 47%, transparent 53%, var(--color2) 75%, transparent 100%);
		  opacity: 0.5;
		  filter: brightness(0.5) contrast(1);
		  z-index: 1;
		}

		#banner{
			height: 60%;
			width: 98.8vw;
		}

		.opening {
			text-align: left;
  			margin-left: 35vw;
		}

		.container {
		  display: flex;
		  gap: 20px;
		  margin: auto;
		  display: flex;
		  justify-content: center;
		  align-items: center;
		}

		.box {
		  padding: 10px;
		  width: 30vw;
		  height: 40vh;
		  box-sizing: border-box;
		  border: 2px solid #000;
		  position: relative;
		  background-repeat: repeat-x;
		  --b: conic-gradient(
		    #efefef 90deg,
		    #191919 0
		  );
		  background-image: 
		    var(--b),
		    var(--b);
		  background-position:
		    right 0px top 0px,
		    right 5px top 5px,
		    right 15px top 15px,
		    right 35px top 35px,
		    right 75px top 75px,
		    right 155px top 155px,
		    right 315px top 315px,
		    right 635px top 635px,
		    right 1275px top 1275px,
		    right 2555px top 2555px;
		  background-size:
		    5px 5px,
		    10px 10px,
		    20px 20px,
		    40px 40px,
		    80px 80px,
		    160px 160px,
		    320px 320px,
		    640px 640px,
		    1280px 1280px,
		    2560px 2560px;
		}

		.footer-wrapper {

		}

		.footer-bars {
		  z-index: 8;
		  width: calc((100vw - 98.8vw)/2);
		  height: 100px;
		  background-color: lightgray;
		  position: fixed;
		  bottom: 0px;
		  left: 0px;
		}

		.footer { /*update this*/
		  scale: 3.5;
			position: fixed;
			bottom: -40px;
			width: 100vw;
			height: 5vh;
			background-repeat: repeat-x;
			--b: conic-gradient(
				#efefef 90deg,
				#191919 90deg 180deg,
				#efefef 180deg 270deg,
				#191919 0
			);
		  background-image: url("https://assets.codepen.io/13471/sparkles.gif"), url(https://assets.codepen.io/13471/holo.png);
			background-position:
				right 0px top 0px,
				right 5px top 5px,
				right 15px top 15px,
				right 35px top 35px,
				right 75px top 75px,
				right 155px top 155px,
				right 315px top 315px,
				right 635px top 635px,
				right 1275px top 1275px,
				right 2555px top 2555px;
			background-size:
				5px 5px,
				10px 10px,
				20px 20px,
				40px 40px,
				80px 80px,
				160px 160px,
				320px 320px,
				640px 640px,
				1280px 1280px,
				2560px 2560px;
		}

	</style>
</head>
<body>
    <div id="anchor"></div>
</body>
<script  src="./prod.js"></script>
</html>
